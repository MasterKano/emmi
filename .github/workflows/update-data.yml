name: Update market data
# Mode shown in the run title (a box-side trigger dispatches with an explicit mode and reads it back to avoid duplicates)
run-name: "Update market data (${{ inputs.mode || ((startsWith(github.event.schedule, '30 12') || github.event.schedule == '30 17 * * *') && 'power') || (github.event.schedule == '0 21 * * 1-5' && 'market') || 'full' }})"

on:
  schedule:
    # UTC. Weekdays ~05:30 (pre-Europe open), ~12:30 (Nordic Power only: tomorrow's day-ahead prices; EEX settlements
    # are as of the last scrape, which runs in the evening after EEX publishes) and ~21:00 (after US close; markets + news only).
    # Weekends ~12:30: Nordic Power only (day-ahead auctions run every day).
    # Daily ~17:30 UTC (19:30 CEST / 18:30 CET): Nordic Power only, after the ENTSO-E deadline for tomorrow's day-ahead
    # wind/solar forecast (A69, D-1 18:00 Brussels time = 16:00 UTC summer / 17:00 UTC winter), so SE4 'tomorrow
    # expected' capture is filled.
    # Note: GitHub runs scheduled workflows only from the default branch.
    - cron: "30 5 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "0 21 * * 1-5"
    - cron: "30 12 * * 0,6"
    - cron: "30 17 * * *"
    # Catch-up for the weekday full morning build (~09:45 and ~13:45 UTC): runs as "full" but the gate job skips
    # everything when data/market.json is already a full build from today (so it is idempotent).
    - cron: "45 9 * * 1-5"
    - cron: "45 13 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = everything (05:30 run) · market = markets/companies/news/symbols, no power (21:00 run) · power = Nordic power only (12:30/17:30 runs)"
        type: choice
        options: [full, market, power]
        default: full

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # only the catch-up crons are gated; every other trigger always builds
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          CATCHUP: ${{ github.event.schedule == '45 9 * * 1-5' || github.event.schedule == '45 13 * * 1-5' }}
        run: |
          if [ "$CATCHUP" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          head=$(curl -s -m 120 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data/market.json" | head -c 400)
          ts=$(echo "$head" | grep -o '"generated_utc": *"[^"]*"' | grep -o '20[0-9-]*T[0-9:]*' | head -1)
          today4=$(date -u -d "$(date -u +%F) 04:00" +%s)
          if echo "$head" | grep -q '"mode": *"full"' && [ -n "$ts" ] && [ "$(date -u -d "${ts}Z" +%s)" -ge "$today4" ]; then
            echo "Today's full build exists ($ts UTC); catch-up skipped"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No full build today yet (last: ${ts:-unknown}); catching up"; echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # same mapping as run-name: schedule -> mode; manual runs pick it via the input
      MODE: ${{ inputs.mode || ((startsWith(github.event.schedule, '30 12') || github.event.schedule == '30 17 * * *') && 'power') || (github.event.schedule == '0 21 * * 1-5' && 'market') || 'full' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install
        run: pip install -r scripts/requirements.txt
      - name: Market data (Yahoo)
        if: env.MODE != 'power'
        run: python scripts/build_data.py
      - name: Company fundamentals (Yahoo, company panel)
        # ~1 min (4 threads); index data/companies.json + per-company data/co/*.json; not on power-only runs
        if: env.MODE != 'power'
        run: python scripts/build_companies.py
        timeout-minutes: 8
        continue-on-error: true
      - name: News
        if: env.MODE != 'power'
        run: python scripts/build_news.py
        continue-on-error: true
      - name: Nordic power (ENTSO-E, Nord Pool, UMM, EDS, EEX CSV, hydro)
        # ENTSO-E is the primary day-ahead source (~1-2 min); Energy-Charts (~2 req/min) only fills failed zones.
        # Nord Pool prices/UMM and Energinet EDS are keyless; FI wind uses Fingrid when FINGRID_API_KEY is set, else ENTSO-E.
        # Skipped at 21:00.
        if: env.MODE != 'market'
        run: python scripts/build_power.py
        env:
          # ENTSO-E Transparency: day-ahead prices, SE4 wind/load/flows/outages, reservoirs (skipped when unset)
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          # Fingrid open data (data.fingrid.fi), FI wind actual + forecast; optional (ENTSO-E fallback when unset)
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          FINGRID_API_KEY_SECONDARY: ${{ secrets.FINGRID_API_KEY_SECONDARY }}
        timeout-minutes: 15
        continue-on-error: true
      - name: Symbol search index (Markets autofill)
        if: env.MODE != 'power'
        run: python scripts/build_symbols.py
        continue-on-error: true
      - name: Deal flow (exchange announcements, FI insider register)
        # morning full run + the 12:30/17:30 UTC power runs; ~40 s, keyless public feeds
        if: env.MODE != 'market'
        run: python scripts/build_dealflow.py
        timeout-minutes: 6
        continue-on-error: true
      - name: Grid & DC (NESO registers, BNetzA/CRE tenders, TSO notices, data-centre news)
        # once a day, morning full run only; ~20-40 s, keyless public sources; after Deal flow (reads data/dealflow.json)
        if: env.MODE == 'full'
        run: python scripts/build_griddc.py
        timeout-minutes: 5
        continue-on-error: true
      - name: Germany balancing auctions (regelleistung.net FCR/aFRR capacity)
        # daily on power and full runs; keyless XLSX (~5 KB/day); keeps 90 days; openpyxl
        if: env.MODE != 'market'
        run: python scripts/build_balancing.py
        timeout-minutes: 8
        continue-on-error: true
      - name: Germany MaStR solar & battery pipeline (utility aggregates)
        # weekly: script skips when data/mastr_de.json is < 6.5 days old; morning full run only; ~30-60 s
        if: env.MODE == 'full'
        run: python scripts/build_mastr.py
        timeout-minutes: 8
        continue-on-error: true
      - name: Grid & DC events calendar (weekly date check, no network)
        if: env.MODE == 'full'
        run: python scripts/check_griddc_events.py
        continue-on-error: true
      - name: Nordic hydro reservoirs (NVE + ENTSO-E A72 Sweden), weekly
        # morning full run; script skips when data/hydro_nordic.json is < 6.5 days old; ~30 s
        if: env.MODE == 'full'
        run: python scripts/build_hydro_nordic.py
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        timeout-minutes: 5
        continue-on-error: true
      - name: US equity valuations (Shiller, Damodaran, S&P DJI, FRED), monthly
        if: env.MODE == 'full'
        continue-on-error: true
        run: python scripts/build_valuation.py

      - name: Finland wind (Fingrid open data), every power and full build
        if: env.MODE == 'power' || env.MODE == 'full'
        continue-on-error: true
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          FINGRID_API_KEY_SECONDARY: ${{ secrets.FINGRID_API_KEY_SECONDARY }}
        run: python scripts/build_fi_wind.py

      - name: Nordic monthly overview (ENTSO-E A75/A44, NVE), monthly
        if: env.MODE == 'full'
        continue-on-error: true
        timeout-minutes: 25
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python scripts/build_nordic_monthly.py

      - name: Nordic hydro-region precipitation (Open-Meteo), forecast daily, monthly part monthly
        if: env.MODE == 'power' || env.MODE == 'full'
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/build_precip.py

      - name: Commit data back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          # only the files this run actually rewrote (steps can be skipped per schedule);
          # data/co/ holds the per-company detail files (new, changed and removed ones)
          paths="data/market.json data/news.json data/power.json data/symbols.json data/companies.json data/co data/dealflow.json data/griddc.json data/griddc_state.json data/balancing.json data/mastr_de.json data/griddc_events.json data/hydro_nordic.json data/us_valuation.json data/fi_wind.json data/nordic_monthly.json data/nordic_precip.json"
          st=$(git status --porcelain -uall -- $paths)
          if [ -z "$st" ]; then echo "No data changes"; exit 0; fi
          changed=$(echo "$st" | awk '$1!="D"{print $NF}')
          deleted=$(echo "$st" | awk '$1=="D"{print $NF}')
          for f in $changed; do mkdir -p "$RUNNER_TEMP/out/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/out/$f"; done
          for i in 1 2 3; do
            # rebuild the commit on top of the current branch tip (this run's files are the newest)
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            for f in $changed; do mkdir -p "$(dirname "$f")"; cp "$RUNNER_TEMP/out/$f" "$f"; done
            if [ -n "$changed" ]; then git add -- $changed; fi
            for f in $deleted; do git rm -q --ignore-unmatch -- "$f"; done
            if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
            git commit -q -m "Update market data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
