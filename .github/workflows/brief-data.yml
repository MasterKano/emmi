name: Live Brief curves and calendar
on:
  schedule:
    - cron: '12 6,10,14,18,22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brief-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/build_brief_data.py
      - name: Publish changed observations
        run: |
          git add data/wti_curve.json data/macro_calendar.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'emmi-data'
          git config user.email 'ci@localhost'
          git commit -m 'Refresh WTI listed contracts and official macro calendar'
          # Keep concurrent editorial / data commits; never force a branch.
          git pull --rebase origin main
          git push
          # data-watch.yml observes main and dispatches the existing Cloudflare deployment.
