name: Verify site build
# GitHub Pages is not the host. Cloudflare Pages builds the private site from main
# (bash scripts/cf_build.sh → _site). See PRIVACY_CUTOVER.md.
# This workflow only checks that the static output assembles, including the newest
# checked research snapshot when research-history is readable. It does not publish
# a public site. Do not switch this back to deploy-pages: that would put research
# on github.io again.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site (Cloudflare Pages output)
        run: bash scripts/cf_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-site
          path: _site
          retention-days: 5
