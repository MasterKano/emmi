name: Deploy site (Cloudflare, behind Access)
# One controlled build: publishes ONLY the public file list in scripts/site_files.sh
# (root html/js/css, robots.txt, data/, and the newest checked research snapshot as research/out/),
# plus a copy of MasterKano/emmi-data under /emmi/ed/ (main -> ed/main/, live-data -> ed/live/).
# Published to Cloudflare Pages by direct upload (wrangler, project "emmi" = https://emmi-e2e.pages.dev/emmi/),
# which sits behind Cloudflare Access. GitHub Pages was retired on 16 Nov 2026 (Jerry's call): there is no github.io copy.
# The site reads its data only from its own /emmi/ed/ copy, never from raw.githubusercontent.com, so the data stays
# behind Access. emmi-data is read with a read-only deploy key (secret EMMI_DATA_DEPLOY_KEY).
# Fresh data: .github/workflows/data-watch.yml polls emmi-data (and this repo's main) and dispatches this workflow
# within about a minute of any push, so every emmi-data publish reaches the site in a few minutes.
# Cloudflare needs repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID.
# Research is optional here: if research-history is missing, the site still deploys (one never blocks the other).
# Pull requests build the artifact only (dry run); deploy runs on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [emmi-data]
permissions:
  contents: read
concurrency:
  group: cf-deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Newest checked research snapshot (optional)
        id: snap
        run: |
          if git ls-remote --exit-code --heads origin research-history >/dev/null; then
            git fetch -q --depth=1 origin research-history
            mkdir -p "$RUNNER_TEMP/rh" && git archive FETCH_HEAD snapshots | tar -x -C "$RUNNER_TEMP/rh"
            last=$(ls -d "$RUNNER_TEMP"/rh/snapshots/*/ 2>/dev/null | while read d; do [ -f "$d/CHECK_PASS" ] && echo "$d"; done | sort | tail -1)
            echo "dir=${last%/}" >> "$GITHUB_OUTPUT"; echo "research snapshot: ${last:-none}"
          else echo "::warning::research-history not found; deploying site without research"; fi
      - name: Assemble public file list
        run: bash scripts/site_files.sh _site "${{ steps.snap.outputs.dir }}"
      - name: emmi-data copy under /emmi/ed/ (read-only deploy key)
        env:
          KEY: ${{ secrets.EMMI_DATA_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "::error::EMMI_DATA_DEPLOY_KEY missing; the site would have no live data"; exit 1; fi
          install -m 600 /dev/null "$RUNNER_TEMP/k" && printf '%s\n' "$KEY" > "$RUNNER_TEMP/k"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          for b in main live-data; do
            d="$RUNNER_TEMP/ed-$b"; git clone -q --depth 1 --branch "$b" git@github.com:MasterKano/emmi-data.git "$d"
            echo "emmi-data $b: $(git -C "$d" log -1 --format='%h %cI %s')"
          done
          rm -f "$RUNNER_TEMP/k"
          # data folders only: no workflows, scripts or README on the site
          mkdir -p _site/ed/main _site/ed/live
          for x in curves data nordic-climate nordic-v2 og-mining-v2; do
            [ -d "$RUNNER_TEMP/ed-main/$x" ] && cp -a "$RUNNER_TEMP/ed-main/$x" _site/ed/main/
          done
          cp -a "$RUNNER_TEMP/ed-live-data/data" _site/ed/live/
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, subprocess, sys, datetime
          t = sys.argv[1]
          head = lambda b: subprocess.check_output(["git", "-C", f"{t}/ed-{b}", "log", "-1", "--format=%H %cI"], text=True).split()
          m, l = head("main"), head("live-data")
          json.dump({"built_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                     "main": {"sha": m[0], "committed": m[1]}, "live": {"sha": l[0], "committed": l[1]}},
                    open("_site/ed/stamp.json", "w"), indent=1)
          PY
          test -s _site/ed/live/data/market.json || { echo "::error::no live-data market.json"; exit 1; }
          echo "ed: $(find _site/ed -type f | wc -l) files, $(du -sh _site/ed | cut -f1)"
      - name: Cloudflare copy (site under /emmi/)
        run: |
          mkdir -p _cf && cp -a _site _cf/emmi
          printf '/ /emmi/ 302\n/emmi /emmi/ 301\n' > _cf/_redirects
          # data copies must never be cached stale by a browser
          printf '/emmi/ed/*\n  Cache-Control: no-cache\n/emmi/data/*\n  Cache-Control: no-cache\n' > _cf/_headers
      - uses: actions/upload-artifact@v4
        with:
          name: cf-site
          path: _cf
          include-hidden-files: true
          retention-days: 3
  cloudflare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cf-site
          path: _cf
      - name: Deploy to Cloudflare Pages (direct upload)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::no Cloudflare token; skipping"; exit 0; fi
          npx -y wrangler@3 pages project create emmi --production-branch main || true
          npx -y wrangler@3 pages deploy _cf --project-name emmi --branch main --commit-dirty=true
