name: Deploy site (controlled Pages build)
# One controlled Pages build: publishes ONLY the public file list in scripts/site_files.sh
# (root html/js/css, robots.txt, data/, and the newest checked research snapshot as research/out/).
# Live prices stay on the public MasterKano/emmi-data repo. live.js reads
# https://raw.githubusercontent.com/MasterKano/emmi-data/live-data/ first and falls back to data/ on the site.
# Published twice from the same build: GitHub Pages (https://masterkano.github.io/emmi/) and, from 15 Nov 2026
# (Jerry's call), Cloudflare Pages by direct upload (wrangler, project "emmi", new account; no Git link).
# Cloudflare serves the site under /emmi/ so the site's absolute /emmi/ links work unchanged; / redirects there.
# Cloudflare needs repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID.
# Research is optional here: if research-history is missing, the site still deploys (one never blocks the other).
# Pull requests build the artifact only (dry run); deploy runs on main.
# Rollback (one step, publishes the whole main tree, not this file list):
# gh api -X PUT repos/MasterKano/emmi/pages -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/'
on:
  push:
    branches: [main]
    # Quote-only commits stay on main for raw.githubusercontent.com. They do not rebuild the site.
    paths-ignore:
      - 'data/og-quotes.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Newest checked research snapshot (optional)
        id: snap
        run: |
          if git ls-remote --exit-code --heads origin research-history >/dev/null; then
            git fetch -q --depth=1 origin research-history
            mkdir -p "$RUNNER_TEMP/rh" && git archive FETCH_HEAD snapshots | tar -x -C "$RUNNER_TEMP/rh"
            last=$(ls -d "$RUNNER_TEMP"/rh/snapshots/*/ 2>/dev/null | while read d; do [ -f "$d/CHECK_PASS" ] && echo "$d"; done | sort | tail -1)
            echo "dir=${last%/}" >> "$GITHUB_OUTPUT"; echo "research snapshot: ${last:-none}"
          else echo "::warning::research-history not found; deploying site without research"; fi
      - name: Assemble public file list
        run: bash scripts/site_files.sh _site "${{ steps.snap.outputs.dir }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Cloudflare copy (site under /emmi/)
        run: |
          mkdir -p _cf && cp -a _site _cf/emmi
          printf '/ /emmi/ 302\n/emmi /emmi/ 301\n' > _cf/_redirects
      - uses: actions/upload-artifact@v4
        with:
          name: cf-site
          path: _cf
          include-hidden-files: true
          retention-days: 3
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  cloudflare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cf-site
          path: _cf
      - name: Deploy to Cloudflare Pages (direct upload)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::no Cloudflare token; skipping"; exit 0; fi
          npx -y wrangler@3 pages project create emmi --production-branch main || true
          npx -y wrangler@3 pages deploy _cf --project-name emmi --branch main --commit-dirty=true
